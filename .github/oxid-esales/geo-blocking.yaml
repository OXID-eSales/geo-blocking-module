install:
  cache:
    prepared_shop: false
  composer:
    transform: |
      {
          "require": {
              "oxid-esales/oxideshop-ce": "{{ .Data.install.composer.dev_ref }}",
              "oxid-esales/twig-admin-theme": "{{ .Data.install.composer.dev_ref }}",
              "oxid-esales/twig-component": "{{ .Data.install.composer.dev_ref }}",
              "oxid-esales/apex-theme": "{{ .Data.install.composer.dev_ref }}",
              "oxid-esales/geo-blocking-module": "{{ .Data.install.composer.ref_name }}"
          },
          "repositories": {
            "oxid-esales/geo-blocking-module": {
              "type": "git",
              "url": "https://github.com/OXID-eSales/geo-blocking-module.git"
            }
          }
      }
  custom_script_container: |
    vendor/bin/oe-console oe:theme:activate apex
    vendor/bin/oe-console oe:module:activate oegeoblocking

runscript: &runscript
  matrix:
    script: |
      [
        "oegeoblocking:tests-integration",
        "oegeoblocking:tests-codeception",
      ]
  oegeoblocking:
    path: 'vendor/oxid-esales/geo-blocking-module'

runslim:
  <<: *runscript
  matrix:
    script: |
      [
        "oegeoblocking:phpstan-report",
        "oegeoblocking:phpmd-report",
        "oegeoblocking:phpcs-report",
      ]

sonarcloud:
  matrix:
    testplan: '["-"]'
  strip_path: '/var/www/vendor/oxid-esales/geo-blocking-module/'
  organization: 'oxid-esales'
  project_name: 'oxid-esales/geo-blocking-module'
  project_key: 'OXID-eSales_geo-blocking-module'
  target_branch: 'b-7.4.x'
  parameters: >
    -Dsonar.language=php
    -Dsonar.scm.provider=git
    -Dsonar.sources=src
    -Dsonar.tests=tests

finish:
  slack_title: 'Module Geo Blocking ({{ .Data.install.git.ref }}) by {{ .Github.Actor }}'